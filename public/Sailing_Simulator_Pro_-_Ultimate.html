<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Sailing Simulator Pro — Ultimate</title>
    <style>
        body {
            margin: 0;
            overflow: hidden;
            background-color: #000;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            user-select: none;
            -webkit-user-select: none;
            -webkit-touch-callout: none;
        }
        
        .hud-panel {
            position: absolute;
            background: rgba(255, 255, 255, 0.95);
            border: 2px solid #666;
            border-radius: 8px;
            box-shadow: 0px 5px 15px rgba(0,0,0,0.5);
            padding: 10px;
            z-index: 100;
            pointer-events: auto;
        }
        
        .instrument {
            text-align: center;
            margin-bottom: 10px;
            border: 1px solid #ddd;
            background: #fff;
            padding: 8px;
            width: 80px;
            border-radius: 6px;
            box-shadow: inset 0 2px 5px rgba(0,0,0,0.05);
        }
        .instrument:last-child { margin-bottom: 0; }
        .inst-title { font-size: 11px; color: #777; margin-bottom: 5px; font-weight: bold; text-transform: uppercase; }
        .inst-value { font-size: 24px; font-weight: 800; color: #222; font-family: monospace;}
        
        #left-hud { top: 20px; left: 20px; }
        #right-hud { top: 20px; right: 20px; }
        
        #btn-engine {
            cursor: pointer;
            transition: all 0.2s ease;
            background: #f8f8f8;
            border: 2px solid #ccc;
        }
        #btn-engine:active { transform: scale(0.95); background: #eee; }

        #steering-wheel-container {
            position: absolute;
            bottom: 30px;
            left: 30px;
            width: 140px;
            height: 140px;
            z-index: 100;
            border-radius: 50%;
            touch-action: none;
        }
        #steering-wheel {
            width: 100%;
            height: 100%;
            border: 8px solid #6b3e1b;
            border-radius: 50%;
            background: rgba(0,0,0,0.15);
            box-shadow: 0 10px 25px rgba(0,0,0,0.5), inset 0 0 10px rgba(0,0,0,0.5);
            box-sizing: border-box;
            transition: none;
            will-change: transform;
            position: relative;
        }
        .spoke {
            position: absolute;
            top: 50%; left: -4px; right: -4px;
            height: 6px;
            background: #a0522d;
            transform-origin: center;
            border-radius: 3px;
        }
        .spoke:nth-child(2) { transform: translateY(-50%) rotate(45deg); }
        .spoke:nth-child(3) { transform: translateY(-50%) rotate(90deg); }
        .spoke:nth-child(4) { transform: translateY(-50%) rotate(135deg); }
        .center-cap {
            position: absolute; top: 50%; left: 50%;
            width: 24px; height: 24px; background: #ddd; border: 2px solid #888;
            border-radius: 50%; transform: translate(-50%, -50%);
        }
        
        .controls-hint {
            position: absolute; bottom: 20px; width: 100%;
            text-align: center; color: rgba(255,255,255,0.8);
            font-size: 14px; pointer-events: none; z-index: 5; text-shadow: 1px 1px 3px #000;
        }

        #loading {
            position: absolute; top: 0; left: 0; right: 0; bottom: 0;
            background: #111; color: #fff; display: flex; justify-content: center; align-items: center;
            font-size: 22px; z-index: 999; transition: opacity 0.5s ease;
        }
    </style>

<style id="ultimate-style">
  #marine-panel {
    position: absolute; left: 50%; top: 18px; transform: translateX(-50%); z-index: 120;
    width: min(360px, calc(100vw - 172px)); padding: 11px 13px; color: #e8fbff;
    border: 1px solid rgba(170,239,245,.30); border-radius: 13px;
    background: linear-gradient(135deg, rgba(4,25,38,.86), rgba(10,57,66,.54));
    box-shadow: 0 14px 40px rgba(0,0,0,.32), inset 0 1px 0 rgba(255,255,255,.10);
    backdrop-filter: blur(12px); font-family: "Segoe UI", system-ui, sans-serif;
  }
  #marine-panel .marine-title { display: flex; justify-content: space-between; align-items: center; margin-bottom: 9px; font-size: 10px; letter-spacing: .14em; color: #a8d8df; font-weight: 800; }
  #marine-panel .marine-live { color: #81f0d8; font-size: 9px; }
  #marine-panel .marine-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 9px; }
  #marine-panel label { display: block; color: #9bc0c9; font-size: 9px; letter-spacing: .08em; }
  #marine-panel strong { float: right; color: #f2ffff; font: 700 10px ui-monospace, SFMono-Regular, Menlo, monospace; }
  #marine-panel input { width: 100%; margin-top: 5px; accent-color: #6ee6dd; }
  #marine-panel button { width: 100%; grid-column: 1 / -1; border: 1px solid rgba(137,236,224,.34); border-radius: 8px; padding: 7px 8px; color: #dffffb; background: rgba(123,232,222,.11); font-size: 10px; font-weight: 800; letter-spacing: .06em; cursor: pointer; }
  #marine-panel button:active { transform: translateY(1px); }
  #wave-readout {
    position: absolute; right: 20px; bottom: 190px; z-index: 110; padding: 8px 10px;
    border-left: 2px solid #79e9df; border-radius: 0 8px 8px 0; color: rgba(235,254,255,.88);
    background: rgba(3,22,34,.52); font: 10px/1.5 ui-monospace, SFMono-Regular, Menlo, monospace;
    pointer-events: none; text-shadow: 0 1px 4px #000;
  }
  .instrument .inst-value { letter-spacing: -.06em; }
  #btn-engine { border-color: rgba(123,232,222,.45); background: linear-gradient(135deg, #f8ffff, #dff4f4); }
  #btn-engine.engine-active { box-shadow: 0 0 0 2px rgba(123,232,222,.28), 0 6px 18px rgba(45,185,173,.24); }
  @media (max-width: 760px) {
    #marine-panel { top: 10px; width: min(260px, calc(100vw - 150px)); padding: 8px 10px; }
    #marine-panel .marine-title { margin-bottom: 5px; font-size: 8px; }
    #marine-panel label { font-size: 8px; }
    #marine-panel button { padding: 5px; font-size: 8px; }
    #wave-readout { right: 10px; bottom: 170px; font-size: 8px; }
  }
</style>

</head>
<body>
    <div id="left-hud" class="hud-panel">
        <div class="instrument">
            <div class="inst-title">Speed <span style="font-size:8px; float:right;">KN</span></div>
            <div class="inst-value" id="hud-speed">0.0</div>
        </div>
        <div class="instrument">
            <div class="inst-title">Depth <span style="font-size:8px; float:right;">FT</span></div>
            <div class="inst-value" id="hud-depth">45.2</div>
        </div>
    </div>
    
    <div id="right-hud" class="hud-panel">
        <div class="instrument" id="btn-engine">
            <div class="inst-title">Engine</div>
            <div class="inst-value" id="hud-engine" style="font-size: 18px; line-height: 32px; color: #555;">OFF</div>
        </div>
    </div>

    <div id="steering-wheel-container">
        <div id="steering-wheel">
            <div class="spoke" style="transform: translateY(-50%) rotate(0deg);"></div>
            <div class="spoke"></div>
            <div class="spoke"></div>
            <div class="spoke"></div>
            <div class="center-cap"></div>
        </div>
    </div>

    <div class="controls-hint">Клик ENGINE | Тяни штурвал (или A/D)</div>

    <div id="loading">Генерация теней и освещения...</div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/objects/Sky.js"></script>

    <script>
        let scene, camera, renderer, controls, pmremGenerator;
        let ocean, boat, sunLight, sunSprite;
        let clock = new THREE.Clock();
        
        const waveParams = { speed: 1.2, height: 0.7 };
        let engineState = 0; 
        let currentSpeed = 0;
        let targetSpeed = 0;
        let steering = 0; 
        let boatHeading = 0; 
        let wheelRotation = 0;

        window.onload = function () {
            init();
            setupInteractions();
            setTimeout(() => {
                document.getElementById('loading').style.opacity = '0';
                setTimeout(() => document.getElementById('loading').style.display = 'none', 500);
            }, 1000);
        };

        function init() {
            scene = new THREE.Scene();

            camera = new THREE.PerspectiveCamera(55, window.innerWidth / window.innerHeight, 0.1, 5000);
            camera.position.set(12, 8, 20);

            renderer = new THREE.WebGLRenderer({ antialias: true, powerPreference: "high-performance" });
            renderer.setSize(window.innerWidth, window.innerHeight);
            renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
            
            // Включаем поддержку теней
            renderer.shadowMap.enabled = true;
            renderer.shadowMap.type = THREE.PCFSoftShadowMap;
            
            renderer.toneMapping = THREE.ACESFilmicToneMapping;
            renderer.toneMappingExposure = 0.7; // Оптимальная яркость
            document.body.appendChild(renderer.domElement);

            pmremGenerator = new THREE.PMREMGenerator(renderer);
            pmremGenerator.compileEquirectangularShader();

            createPhysicalSkyAndLighting();
            createRealisticOcean();
            createDetailedCatamaran();
            createIslands();

            controls = new THREE.OrbitControls(camera, renderer.domElement);
            controls.enableDamping = true;
            controls.dampingFactor = 0.05;
            controls.maxPolarAngle = Math.PI / 2 - 0.05;
            controls.minDistance = 5;
            controls.maxDistance = 100;
            controls.target.set(0, 3, 0);

            window.addEventListener('resize', onWindowResize, false);
            animate();
        }

        function createPhysicalSkyAndLighting() {
            const sky = new THREE.Sky();
            sky.scale.setScalar(4500);
            scene.add(sky);

            const sunPosition = new THREE.Vector3();
            const uniforms = sky.material.uniforms;
            uniforms['turbidity'].value = 8;
            uniforms['rayleigh'].value = 1.5;
            uniforms['mieCoefficient'].value = 0.005;
            uniforms['mieDirectionalG'].value = 0.8;

            const elevation = 15; // Высота солнца
            const azimuth = 180;
            const phi = THREE.MathUtils.degToRad(90 - elevation);
            const theta = THREE.MathUtils.degToRad(azimuth);
            sunPosition.setFromSphericalCoords(1, phi, theta);
            uniforms['sunPosition'].value.copy(sunPosition);

            scene.environment = pmremGenerator.fromScene(sky).texture;

            // 1. ЗАПОЛНЯЮЩИЙ СВЕТ (убирает 100% черные тени с островов и лодки)
            const hemiLight = new THREE.HemisphereLight(0xffffff, 0x446688, 0.7);
            scene.add(hemiLight);

            // 2. НАПРАВЛЕННЫЙ СВЕТ (Солнце) - Создает тени
            sunLight = new THREE.DirectionalLight(0xffeedd, 2.5);
            sunLight.castShadow = true;
            
            // Настройка качества и зоны теней
            sunLight.shadow.mapSize.width = 2048;
            sunLight.shadow.mapSize.height = 2048;
            sunLight.shadow.camera.near = 10;
            sunLight.shadow.camera.far = 600;
            const d = 100; // Широкая зона теней вокруг лодки
            sunLight.shadow.camera.left = -d; 
            sunLight.shadow.camera.right = d;
            sunLight.shadow.camera.top = d; 
            sunLight.shadow.camera.bottom = -d;
            sunLight.shadow.bias = -0.001; // Предотвращает лесенки теней на самой себе

            scene.add(sunLight);
            scene.add(sunLight.target); // Важно добавить target в сцену, чтобы он мог двигаться!

            // Сохраняем вектор смещения солнца, чтобы оно всегда было под нужным углом к лодке
            sunLight.userData.offset = new THREE.Vector3().setFromSphericalCoords(300, phi, theta);
            
            createSunGlow(sunPosition);
        }

        function createSunGlow(position) {
            const canvas = document.createElement('canvas');
            canvas.width = 256;
            canvas.height = 256;
            const context = canvas.getContext('2d');
            
            const gradient = context.createRadialGradient(
                canvas.width / 2, canvas.height / 2, 0,
                canvas.width / 2, canvas.height / 2, canvas.width / 2
            );
            gradient.addColorStop(0, 'rgba(255, 255, 255, 1)');
            gradient.addColorStop(0.1, 'rgba(255, 255, 200, 0.9)');
            gradient.addColorStop(0.4, 'rgba(255, 200, 100, 0.4)');
            gradient.addColorStop(1, 'rgba(255, 200, 100, 0)');

            context.fillStyle = gradient;
            context.fillRect(0, 0, canvas.width, canvas.height);

            const texture = new THREE.CanvasTexture(canvas);
            const material = new THREE.SpriteMaterial({
                map: texture,
                blending: THREE.AdditiveBlending,
                fog: false,
                depthWrite: false
            });
            
            sunSprite = new THREE.Sprite(material);
            sunSprite.scale.set(500, 500, 1);
            sunSprite.position.copy(position).normalize().multiplyScalar(4000);
            scene.add(sunSprite);
        }

        function generateNormalMap() {
            const canvas = document.createElement('canvas');
            canvas.width = 512; canvas.height = 512;
            const ctx = canvas.getContext('2d');
            const imgData = ctx.createImageData(512, 512);
            
            for (let y = 0; y < 512; y++) {
                for (let x = 0; x < 512; x++) {
                    let nx = Math.sin(x * 0.1) * Math.cos(y * 0.1) * 0.5 + Math.sin(x * 0.3 + y * 0.2) * 0.2;
                    let ny = Math.sin(y * 0.1) * Math.cos(x * 0.1) * 0.5 + Math.sin(y * 0.3 - x * 0.2) * 0.2;
                    let nz = 1.5; 
                    
                    let mag = Math.sqrt(nx*nx + ny*ny + nz*nz);
                    nx /= mag; ny /= mag; nz /= mag;
                    
                    let idx = (y * 512 + x) * 4;
                    imgData.data[idx] = (nx * 0.5 + 0.5) * 255;
                    imgData.data[idx+1] = (ny * 0.5 + 0.5) * 255;
                    imgData.data[idx+2] = (nz * 0.5 + 0.5) * 255;
                    imgData.data[idx+3] = 255;
                }
            }
            ctx.putImageData(imgData, 0, 0);
            const tex = new THREE.CanvasTexture(canvas);
            tex.wrapS = THREE.RepeatWrapping; tex.wrapT = THREE.RepeatWrapping;
            return tex;
        }

        function createRealisticOcean() {
            const oceanGeo = new THREE.PlaneGeometry(3000, 3000, 120, 120);
            oceanGeo.rotateX(-Math.PI / 2);

            const oceanMat = new THREE.MeshPhysicalMaterial({
                color: 0x007799,
                metalness: 0.95,
                roughness: 0.1,
                normalMap: generateNormalMap(),
                normalScale: new THREE.Vector2(0.8, 0.8), // Слегка уменьшили жесткость ряби
                envMap: scene.environment,
                envMapIntensity: 1.0,
                clearcoat: 1.0,
                clearcoatRoughness: 0.1
            });

            ocean = new THREE.Mesh(oceanGeo, oceanMat);
            ocean.receiveShadow = true; // Океан принимает тени от лодки!
            scene.add(ocean);
        }

        function createDetailedCatamaran() {
            boat = new THREE.Group();
            
            // Материалы настроены на прием и отбрасывание теней
            const hullMat = new THREE.MeshStandardMaterial({ color: 0xffffff, roughness: 0.2, metalness: 0.1, envMap: scene.environment }); 
            const deckMat = new THREE.MeshStandardMaterial({ color: 0xddcbaa, roughness: 0.9 });
            const darkGlassMat = new THREE.MeshPhysicalMaterial({ color: 0x050505, roughness: 0.05, metalness: 0.9, envMap: scene.environment });
            const metalMat = new THREE.MeshStandardMaterial({ color: 0xcccccc, metalness: 0.9, roughness: 0.3, envMap: scene.environment });
            const sailMat = new THREE.MeshStandardMaterial({ color: 0x112244, roughness: 0.9 });

            function createHull() {
                const hull = new THREE.Group();
                const bodyGeo = new THREE.SphereGeometry(1, 32, 16);
                const body = new THREE.Mesh(bodyGeo, hullMat);
                body.scale.set(1.2, 1.8, 9);
                body.position.y = 0.5;
                body.castShadow = true; body.receiveShadow = true; // Тени включены
                hull.add(body);
                
                const deckCut = new THREE.Mesh(new THREE.BoxGeometry(2.5, 0.5, 18), hullMat);
                deckCut.position.y = 2.0; 
                deckCut.castShadow = true; deckCut.receiveShadow = true;
                hull.add(deckCut);
                return hull;
            }

            const leftHull = createHull(); leftHull.position.set(-3.5, 0, 0); boat.add(leftHull);
            const rightHull = createHull(); rightHull.position.set(3.5, 0, 0); boat.add(rightHull);

            const mainDeck = new THREE.Mesh(new THREE.BoxGeometry(7, 0.3, 10), deckMat);
            mainDeck.position.set(0, 2.2, 1); 
            mainDeck.castShadow = true; mainDeck.receiveShadow = true; 
            boat.add(mainDeck);

            const cabinGeo = new THREE.CylinderGeometry(2.5, 3.5, 1.5, 4, 1, false, Math.PI/4, Math.PI*2);
            const cabin = new THREE.Mesh(cabinGeo, hullMat);
            cabin.scale.set(1.5, 1, 1.2);
            cabin.position.set(0, 3.0, 1.5);
            cabin.rotation.y = Math.PI / 4;
            cabin.castShadow = true; cabin.receiveShadow = true;
            boat.add(cabin);
            
            const roof = new THREE.Mesh(new THREE.BoxGeometry(7, 0.2, 6), hullMat);
            roof.position.set(0, 3.8, 1.5);
            roof.castShadow = true; roof.receiveShadow = true;
            boat.add(roof);

            const glass = new THREE.Mesh(new THREE.CylinderGeometry(2.55, 3.55, 1.0, 4, 1, false, Math.PI/4, Math.PI/2), darkGlassMat);
            glass.scale.set(1.5, 1, 1.2);
            glass.position.set(0, 3.0, 1.5);
            glass.rotation.y = Math.PI / 4;
            boat.add(glass);

            const mast = new THREE.Mesh(new THREE.CylinderGeometry(0.1, 0.15, 20, 16), metalMat);
            mast.position.set(0, 13, -1); mast.castShadow = true; boat.add(mast);

            const boom = new THREE.Mesh(new THREE.CylinderGeometry(0.1, 0.1, 8, 16), metalMat);
            boom.rotateX(Math.PI / 2); boom.position.set(0, 4.5, 3); boom.castShadow = true; boat.add(boom);

            const sailCover = new THREE.Mesh(new THREE.CylinderGeometry(0.3, 0.3, 7.5, 16), sailMat);
            sailCover.rotateX(Math.PI / 2); sailCover.position.set(0, 4.7, 3); sailCover.castShadow = true; boat.add(sailCover);

            function addHelm(xPos) {
                const helmStand = new THREE.Mesh(new THREE.BoxGeometry(0.5, 1.2, 0.5), hullMat);
                helmStand.position.set(xPos, 2.8, 5.5);
                helmStand.castShadow = true; helmStand.receiveShadow = true;
                
                const wheelGeo = new THREE.TorusGeometry(0.4, 0.04, 8, 24);
                const wheel = new THREE.Mesh(wheelGeo, metalMat);
                wheel.position.set(xPos, 3.4, 5.8);
                wheel.castShadow = true;
                
                boat.add(helmStand); boat.add(wheel);
            }
            addHelm(-3); addHelm(3);

            scene.add(boat);
        }

        function createIslands() {
            // Острова теперь имеют зеленовато-песчаный цвет и реагируют на свет
            const islandMat = new THREE.MeshStandardMaterial({ color: 0x4a5a3a, roughness: 1.0, flatShading: true });
            
            function createIsland(radius, heightMax, x, z) {
                const geo = new THREE.PlaneGeometry(radius, radius, 32, 32);
                geo.rotateX(-Math.PI / 2);
                const pos = geo.attributes.position;
                for(let i=0; i < pos.count; i++) {
                    const vx = pos.getX(i); const vz = pos.getZ(i);
                    const dist = Math.sqrt(vx*vx + vz*vz) / (radius/2); 
                    if(dist < 1.0) {
                        let h = Math.cos(dist * Math.PI / 2) * heightMax;
                        h += Math.sin(vx * 0.1) * Math.cos(vz * 0.1) * (heightMax * 0.3);
                        pos.setY(i, h - 2);
                    } else pos.setY(i, -10);
                }
                geo.computeVertexNormals();
                const island = new THREE.Mesh(geo, islandMat);
                island.position.set(x, 0, z);
                scene.add(island);
            }

            createIsland(700, 150, -500, -1200);
            createIsland(400, 80, 400, -900);
        }

        function setupInteractions() {
            const btnEngine = document.getElementById('btn-engine');
            const hudEngine = document.getElementById('hud-engine');
            const wheelContainer = document.getElementById('steering-wheel-container');

            function toggleEngine(e) {
                e.preventDefault();
                if(engineState === 0) {
                    engineState = 1; targetSpeed = 15.0;
                    hudEngine.innerText = 'FWD'; hudEngine.style.color = '#00aa00';
                } else if(engineState === 1) {
                    engineState = -1; targetSpeed = -5.0;
                    hudEngine.innerText = 'REV'; hudEngine.style.color = '#cc0000';
                } else {
                    engineState = 0; targetSpeed = 0;
                    hudEngine.innerText = 'OFF'; hudEngine.style.color = '#555';
                }
            }
            btnEngine.addEventListener('pointerdown', toggleEngine);

            let isDraggingWheel = false;
            let wheelCenterX = 0;

            function startSteering(e) {
                e.preventDefault();
                isDraggingWheel = true;
                const rect = wheelContainer.getBoundingClientRect();
                wheelCenterX = rect.left + rect.width / 2;
                updateSteering(e.clientX || (e.touches && e.touches[0].clientX));
            }

            function moveSteering(e) {
                if(!isDraggingWheel) return;
                e.preventDefault();
                updateSteering(e.clientX || (e.touches && e.touches[0].clientX));
            }

            function stopSteering() {
                isDraggingWheel = false;
                steering = 0;
            }

            function updateSteering(clientX) {
                if(clientX === undefined) return;
                const diff = clientX - wheelCenterX;
                steering = Math.max(-1, Math.min(1, -diff / 50)); 
            }

            wheelContainer.addEventListener('pointerdown', startSteering);
            window.addEventListener('pointermove', moveSteering);
            window.addEventListener('pointerup', stopSteering);
            wheelContainer.addEventListener('touchstart', startSteering, {passive: false});
            window.addEventListener('touchmove', moveSteering, {passive: false});
            window.addEventListener('touchend', stopSteering);

            window.addEventListener('keydown', (e) => {
                const k = e.key.toLowerCase();
                if(k === 'w') { engineState = 1; targetSpeed = 15; hudEngine.innerText = 'FWD'; hudEngine.style.color = '#00aa00'; }
                if(k === 's') { engineState = -1; targetSpeed = -5; hudEngine.innerText = 'REV'; hudEngine.style.color = '#cc0000'; }
                if(k === ' ') { engineState = 0; targetSpeed = 0; hudEngine.innerText = 'OFF'; hudEngine.style.color = '#555'; }
                if(k === 'a') steering = 1;
                if(k === 'd') steering = -1;
            });
            window.addEventListener('keyup', (e) => {
                const k = e.key.toLowerCase();
                if(k === 'a' || k === 'd') steering = 0;
            });
        }

        function getWaveHeight(x, z, time) {
            let y = 0;
            y += Math.sin(x * 0.03 + time * waveParams.speed * 0.5) * 1.5;
            y += Math.sin(z * 0.04 + time * waveParams.speed * 0.6) * 1.0;
            y += Math.sin((x + z) * 0.05 + time * waveParams.speed) * 0.8;
            return y * waveParams.height;
        }

        function updateOcean(time) {
            if (!ocean || !boat) return;
            
            ocean.position.x = boat.position.x;
            ocean.position.z = boat.position.z;

            const positions = ocean.geometry.attributes.position;
            for (let i = 0; i < positions.count; i++) {
                const worldX = positions.getX(i) + ocean.position.x;
                const worldZ = positions.getZ(i) + ocean.position.z;
                positions.setY(i, getWaveHeight(worldX, worldZ, time));
            }
            ocean.geometry.computeVertexNormals();
            positions.needsUpdate = true;

            if (ocean.material.normalMap) {

                ocean.material.normalMap.offset.y = time * 0.02;

        function updatePhysicsAndMovement(time) {
            if (!boat) return;

            currentSpeed += (targetSpeed - currentSpeed) * 0.015;
            document.getElementById('hud-speed').innerText = Math.abs(currentSpeed).toFixed(1);

            const turnRate = steering * 0.015;
            if (currentSpeed > 0.5) boatHeading += turnRate;
            else if (currentSpeed < -0.5) boatHeading -= turnRate; 

            const targetWheelRotation = -steering * 118;
            wheelRotation += (targetWheelRotation - wheelRotation) * 0.18;
            document.getElementById('steering-wheel').style.transform = `rotate(${wheelRotation.toFixed(2)}deg)`;

            const moveStep = currentSpeed * 0.04;
            boat.position.x -= Math.sin(boatHeading) * moveStep;
            boat.position.z -= Math.cos(boatHeading) * moveStep;

            controls.target.x = boat.position.x;
            controls.target.z = boat.position.z;
            camera.position.x -= Math.sin(boatHeading) * moveStep;
            camera.position.z -= Math.cos(boatHeading) * moveStep;

            // КРИТИЧЕСКОЕ ИСПРАВЛЕНИЕ ТЕНЕЙ: Камера теней всегда следует за лодкой!
            if (sunLight && sunLight.userData.offset) {

            const bx = boat.position.x, bz = boat.position.z;
            
            const hFL = getWaveHeight(bx - halfWidth, bz - halfLength, time); 
            const hFR = getWaveHeight(bx + halfWidth, bz - halfLength, time); 
            const hBL = getWaveHeight(bx - halfWidth, bz + halfLength, time); 
            const hBR = getWaveHeight(bx + halfWidth, bz + halfLength, time); 

            const avgHeight = (hFL + hFR + hBL + hBR) / 4;
            // ИСПРАВЛЕНИЕ ОСАДКИ: Опустили лодку еще ниже, чтобы поплавки были глубоко в воде
            boat.position.y = avgHeight - 0.9;

            const avgFront = (hFL + hFR) / 2, avgBack = (hBL + hBR) / 2;
            const targetPitch = Math.atan2(avgBack - avgFront, halfLength * 2);

            const avgLeft = (hFL + hBL) / 2, avgRight = (hFR + hBR) / 2;
            const targetRoll = Math.atan2(avgLeft - avgRight, halfWidth * 2);

            if (!isNaN(targetPitch) && !isNaN(targetRoll)) {
                boat.rotation.x += (targetPitch - boat.rotation.x) * 0.1;
                boat.rotation.z += (targetRoll - boat.rotation.z) * 0.1;
            }
            
            boat.rotation.y = boatHeading + Math.sin(time * 0.2) * 0.03;
        }

                camera.aspect = window.innerWidth / window.innerHeight;
                camera.updateProjectionMatrix();
                renderer.setSize(window.innerWidth, window.innerHeight);
            }
        }

        function animate() {
            requestAnimationFrame(animate);
            const time = clock.getElapsedTime();
            
            updatePhysicsAndMovement(time);
            updateOcean(time);

function tropicalFoamTexture(seed) {

  if (ocean.material.uniforms.waterColor) ocean.material.uniforms.waterColor.value.set(0x039db5);

  var position = geometry.attributes.position;
  ultimateWaterBaseX = new Float32Array(position.count);
  ultimateWaterBaseZ = new Float32Array(position.count);
  for (var i = 0; i < position.count; i++) {
    ultimateWaterBaseX[i] = position.getX(i);
    ultimateWaterBaseZ[i] = -position.getY(i);
  }
  ocean.userData.baseX = ultimateWaterBaseX;
  ocean.userData.baseZ = ultimateWaterBaseZ;

  tropicalFoamLayers = [];
  for (var layer = 0; layer < 2; layer++) {
    var foamGeometry = new THREE.PlaneGeometry(950, 950, 126, 126);
    var foamPosition = foamGeometry.attributes.position;
    var baseX = new Float32Array(foamPosition.count);
    var baseZ = new Float32Array(foamPosition.count);
    for (var p = 0; p < foamPosition.count; p++) { baseX[p] = foamPosition.getX(p); baseZ[p] = -foamPosition.getY(p); }
    var foamMap = tropicalFoamTexture(layer + 1);
    var foam = new THREE.Mesh(foamGeometry, new THREE.MeshBasicMaterial({
      map: foamMap, color: layer ? 0x9ff7f0 : 0xeaffff, transparent: true, opacity: layer ? .17 : .24,
      depthWrite: false, blending: THREE.NormalBlending
    }));
    foam.rotation.x = -Math.PI / 2;
    foam.position.y = -.12;
    foam.material.map.offset.set(layer ? .33 : 0, layer ? .17 : 0);
    foam.userData.baseX = baseX; foam.userData.baseZ = baseZ; foam.userData.scroll = layer ? -.011 : .017;
    foam.renderOrder = 1;
    scene.add(foam);
    tropicalFoamLayers.push(foam);
  }

  ultimateShadow = new THREE.Mesh(new THREE.PlaneGeometry(31, 45), new THREE.MeshBasicMaterial({
    map: ultimateShadowTexture(), transparent: true, depthWrite: false, opacity: .22, color: 0x031d26
  }));
  ultimateShadow.rotation.x = -Math.PI / 2; ultimateShadow.renderOrder = 2; scene.add(ultimateShadow);
  tropicalCreateWake();
};

window.updateOcean = function (time) {
  if (!ocean || !boat) return;
  ocean.position.x = boat.position.x; ocean.position.z = boat.position.z;
  tropicalDisplace(ocean, time, -.12);
  for (var layer = 0; layer < tropicalFoamLayers.length; layer++) {
    var foam = tropicalFoamLayers[layer];
    foam.position.x = boat.position.x; foam.position.z = boat.position.z;
    tropicalDisplace(foam, time, layer ? -.105 : -.095);
    foam.material.map.offset.x = (foam.material.map.offset.x + time * 0.00008) % 1;
    foam.material.map.offset.y = (time * foam.userData.scroll) % 1;
  }
  ultimateWaterNormal.offset.x = time * .027;
  ultimateWaterNormal.offset.y = time * -.019;
  if (ocean.material.uniforms.time) ocean.material.uniforms.time.value = time * .62;
  var under = ultimateSeaState(boat.position.x, boat.position.z, time);
  ultimateShadow.position.set(boat.position.x, under.h - .205, boat.position.z);
  ultimateShadow.material.opacity = .16 + Math.min(.12, Math.abs(ultimateRoll) * .65);
};

window.updatePhysicsAndMovement = function (time, dt) {
  tropicalOriginalPhysics(time, dt);
  tropicalUpdateWake(time, dt || .016);
  if (tropicalSunRays) tropicalSunRays.material.rotation = time * .018;
};

var tropicalPreviousOnload = window.onload;
window.onload = function () {
  ultimateSunElevation = 6;
  tropicalPreviousOnload();
  var sunInput = document.getElementById("sun-slider");
  if (sunInput) sunInput.value = "6";
  var sunDisplay = document.getElementById("sun-display");
  if (sunDisplay) sunDisplay.textContent = "6°";
  var resetButton = document.getElementById("reset-vessel");
  if (resetButton) resetButton.addEventListener("click", function () {
    tropicalWakeHistory.length = 0;
    tropicalWakeLastSample = 0;
    if (tropicalWakeMesh) tropicalWakeMesh.visible = false;
    if (tropicalWakeFootprint) tropicalWakeFootprint.visible = false;
  });
  ultimateUpdateEnvironment(true);
};
</script>
