[SystemSettings]
; Metal can reject the history texture when a storm view or its output surface changes.
; Trace and spatially filter the current cloud shadow map on macOS.
r.VolumetricCloud.ShadowMap.TemporalFiltering.NewFrameWeight=1.0
; Most of the ocean is visible. On Metal the HZB visibility readback can
; stall both the render thread and game thread behind outstanding GPU work.
; Frustum culling rejects off-camera tiles; normal depth testing handles overlap.
r.AllowOcclusionQueries=0
r.HZBOcclusion=0
; Virtual shadow pages leave polygon-shaped shadows across the refracted sand
; at ankle depth on Metal. Cascaded sun shadows preserve the wet/dry transition.
r.Shadow.Virtual.Enable=0
; Bound the lighting and geometry caches on unified memory.
r.Nanite.Streaming.StreamingPoolSize=256
r.LumenScene.SurfaceCache.AtlasSize=3072
; Trace alternating pixels on the sea and resolve the missing samples over time.
r.Water.SingleLayer.Reflection.DownsampleFactor=2
r.Water.SingleLayer.Reflection.DownsampleCheckerboard=1
r.Water.SingleLayer.Reflection.Denoising=1
r.TranslucencyLightingVolume.Dim=32
r.VolumetricFog.GridPixelSize=12
; Cloud illumination varies over a much larger area than the reflected ripples.
r.VolumetricCloud.ShadowMap.MaxResolution=96
r.VolumetricCloud.ShadowMap.RaySampleMaxCount=20
r.VolumetricCloud.ViewRaySampleMaxCount=38
r.VolumetricCloud.ReflectionRaySampleMaxCount=24
r.SkyLight.RealTimeReflectionCapture.VolumetricCloudResolutionDivider=4
r.SkyLight.RealTimeReflectionCapture.TimeSlice.SkyCloudCubeFacePerFrame=1
; Allow temporal reconstruction more headroom during a close storm impact.
r.DynamicRes.MinScreenPercentage=66.667
r.DynamicRes.FrameTimeBudget=29

[SystemSettingsEditor]
; Keep ray-traced authoring and path-traced reference views available.
r.RayTracing.Enable=1
