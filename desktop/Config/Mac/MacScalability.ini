[ShadowQuality@3]
; Two sun cascades cover the yacht and the nearby coast. Each cascade
; rasterizes the Nanite islands again on Metal.
r.Shadow.CSM.MaxCascades=2
r.Shadow.MaxCSMResolution=1280
r.Shadow.DistanceScale=0.64

[GlobalIlluminationQuality@3]
; The sky and sun change slowly relative to the reflected wave normals.
r.LumenScene.DirectLighting.UpdateFactor=64
r.LumenScene.Radiosity.UpdateFactor=128
r.LumenScene.Radiosity.ProbeSpacing=8
r.LumenScene.Radiosity.HemisphereProbeResolution=3

; Cache distant bounce lighting in the global field. Keep direct lighting
; and water reflections at the surface, where their motion is visible.
r.Lumen.TraceMeshSDFs.Allow=0
r.Lumen.ScreenProbeGather.IntegrateDownsampleFactor=2
r.Lumen.ScreenProbeGather.ScreenTraces=0
r.Lumen.ScreenProbeGather.TracingOctahedronResolution=6

[AntiAliasingQuality@3]
; A one-to-one reconstruction history avoids supersampling the sky and water twice.
r.TSR.History.ScreenPercentage=100

r.TSR.History.UpdateQuality=1
r.TSR.RejectionAntiAliasingQuality=1

[ReflectionQuality@3]
r.Lumen.Reflections.ScreenTraces.HZBTraversal.MaxIterations=28
